<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>NASA FIRMS WMS Map</title>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>

<body>

<h2>NASA FIRMS Fire Map</h2>

<!-- Date controls -->
<label for="date1">Beginning Date:</label>
<input type="date" id="date1" value="2026-09-08">

<label for="date2">Ending Date:</label>
<input type="date" id="date2" value="2026-09-13">

<br><br>

<!-- Color control -->
<label for="fire-color">Fire Color:</label>
<input type="color" id="fire-color" value="#dc6464">

<button id="update-map">Update Map</button>

<p id="message"></p>

<!-- Map -->
<div id="map"
     style="height:512px;
            width:512px;
            border:1px solid grey;
            padding:5px">
</div>

<!-- Navigation buttons -->
<button id="button-left">&lt;</button>
<button id="button-right">&gt;</button>

<script>

let date1 = '2026-09-08';
let date2 = '2026-09-13';

let east = -60;
let west = east + 180;

/*
    Put your FIRMS MAP_KEY here.
*/
let key = '24ea57572deba7068e20a2b1e23de08b';


/*
    Converts a hexadecimal HTML color such as:

        #ff1493

    into RGB values:

        255, 20, 147
*/
function hex_to_rgb(hex) {

    let red = parseInt(hex.substring(1, 3), 16);
    let green = parseInt(hex.substring(3, 5), 16);
    let blue = parseInt(hex.substring(5, 7), 16);

    return {
        red: red,
        green: green,
        blue: blue
    };
}


/*
    Draw or redraw the WMS map.
*/
function update_map(east, west, date1, date2) {

    let selected_color = $("#fire-color").val();

    let rgb = hex_to_rgb(selected_color);

    let src =
        `https://firms.modaps.eosdis.nasa.gov/mapserver/wms/fires/${key}/?` +
        `REQUEST=GetMap` +
        `&layers=fires_modis` +
        `&COLORS=${rgb.red}+${rgb.green}+${rgb.blue}` +
        `&TIME=${date1}/${date2}` +
        `&WIDTH=512` +
        `&HEIGHT=512` +
        `&BBOX=${east},-90,${west},90`;

    console.log(src);

    $("#map").html(`<img src="${src}" width="512" height="512">`);
}


/*
    Update button.
*/
$("#update-map").click(function() {

    let new_date1 = $("#date1").val();
    let new_date2 = $("#date2").val();

    let start_date = new Date(new_date1);
    let end_date = new Date(new_date2);

    /*
        Find the difference between dates.

        JavaScript stores time in milliseconds.
    */
    let difference =
        end_date.getTime() - start_date.getTime();

    let number_of_days =
        difference / (1000 * 60 * 60 * 24);


    /*
        Check that ending date is not before
        beginning date.
    */
    if (number_of_days < 0) {

        $("#message").text(
            "The ending date cannot be before the beginning date."
        );

        return;
    }


    /*
        FIRMS allows a maximum date range
        of 30 days.
    */
    if (number_of_days > 30) {

        $("#message").text(
            "Please select a date range of 30 days or less."
        );

        return;
    }


    $("#message").text("");

    date1 = new_date1;
    date2 = new_date2;

    update_map(east, west, date1, date2);
});


/*
    Move map left.
*/
$("#button-left").click(function() {

    east -= 10;
    west = east + 180;

    update_map(east, west, date1, date2);

    if (east <= -180) {
        this.disabled = true;
    }

    if ($("#button-right").prop("disabled")) {
        $("#button-right").prop("disabled", false);
    }

});


/*
    Move map right.
*/
$("#button-right").click(function() {

    east += 10;
    west = east + 180;

    update_map(east, west, date1, date2);

    if (east >= 0) {
        this.disabled = true;
    }

    if ($("#button-left").prop("disabled")) {
        $("#button-left").prop("disabled", false);
    }

});


/*
    Draw the initial map when the page opens.
*/
update_map(east, west, date1, date2);

</script>

</body>

</html>
